name: Weekly report

# Every Monday: download fresh data, save a snapshot, regenerate the report and
# the estimator data the website reads, so trends build up history over time.
on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - run: python -m vidriera_insights.report --refresh
      - run: python -m vidriera_insights.export
      - name: Commit report and snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports data/snapshots web/data.json
          git diff --cached --quiet || git commit -m "Update weekly market report"
          git push
